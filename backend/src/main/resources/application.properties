spring.application.name=backend


server.port=${PORT:8080}

# =========================
# PostgreSQL
# =========================

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/codeorbit}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver


# =========================
# JPA
# =========================


server.forward-headers-strategy=framework

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=true


# =========================
# OpenRouter / Spring AI
# =========================

spring.ai.openai.base-url=https://openrouter.ai/api/v1
spring.ai.openai.api-key=${OPENAI_API_KEY}

spring.ai.openai.chat.model=${OPENAI_CHAT_MODEL:openrouter/free}

spring.ai.openai.embedding.model=${OPENAI_EMBEDDING_MODEL:openai/text-embedding-3-small}


# =========================
# PgVector
# =========================

spring.ai.vectorstore.pgvector.initialize-schema=true
spring.ai.vectorstore.pgvector.dimensions=1536
spring.ai.vectorstore.pgvector.index-type=HNSW
spring.ai.vectorstore.pgvector.distance-type=COSINE_DISTANCE


# =========================
# GitHub OAuth
# =========================

# =========================
# GitHub OAuth
# =========================

spring.security.oauth2.client.registration.github.client-id=${GITHUB_CLIENT_ID}
spring.security.oauth2.client.registration.github.client-secret=${GITHUB_CLIENT_SECRET}
spring.security.oauth2.client.registration.github.scope=${GITHUB_SCOPE:read:user,repo}
spring.security.oauth2.client.registration.github.redirect-uri=${GITHUB_REDIRECT_URI:{baseUrl}/login/oauth2/code/{registrationId}}

spring.security.oauth2.client.provider.github.user-name-attribute=${GITHUB_USER_NAME_ATTRIBUTE:id}
# =========================
# Session
# =========================

server.servlet.session.cookie.name=${SESSION_COOKIE_NAME:CODEORBIT_SESSION}
server.servlet.session.cookie.http-only=${SESSION_COOKIE_HTTP_ONLY:true}
server.servlet.session.cookie.same-site=${SESSION_COOKIE_SAME_SITE:lax}
server.servlet.session.timeout=${SESSION_TIMEOUT:7d}


# =========================
# Application
# =========================

app.frontend-url=${FRONTEND_URL:http://localhost:5173}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}


# =========================
# Encryption
# =========================

app.token-encryptor-password=${TOKEN_ENCRYPTOR_PASSWORD}
app.token-encryptor-salt=${TOKEN_ENCRYPTOR_SALT}


# =========================
# Indexing
# =========================

app.indexing.max-file-bytes=${INDEXING_MAX_FILE_BYTES:102400}
app.indexing.chunk-size=${INDEXING_CHUNK_SIZE:800}
app.indexing.chunk-overlap=${INDEXING_CHUNK_OVERLAP:100}


# =========================
# GitHub API
# =========================

app.github.api-delay-ms=${GITHUB_API_DELAY_MS:50}


logging.level.org.springframework.security=DEBUG
logging.level.org.springframework.security.oauth2=DEBUG
logging.level.org.springframework.security.oauth2.client=TRACE
logging.level.org.springframework.security.oauth2.core=TRACE